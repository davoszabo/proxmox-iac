vm_prefix: "VM_"
terraform_provision_dir: "{{ playbook_dir }}/../tools/terraform/provision"
# PEM text in tf_backend.ca_cert is written to this file and used as the S3 backend CA bundle;
# without it, tf_backend.custom_ca_bundle (a path on the runner) is used as-is.
tf_backend_ca_file: >-
  {{ (terraform_provision_dir ~ '/backend-ca.crt')
     if (cluster.tf_backend.ca_cert | default('') | length > 0)
     else (cluster.tf_backend.custom_ca_bundle | default('')) }}
# Absolute path of tofu (community.general.terraform needs one): /usr/bin/tofu in the
# devcontainer, /usr/local/bin/tofu in the Semaphore image. Override with -e if not on PATH.
tofu_binary_path: "{{ lookup('ansible.builtin.pipe', 'command -v tofu') }}"
