- name: Gather cluster configs
  ansible.builtin.set_fact:
    cluster: "{{ hostvars[groups.cluster[0]] }}"

- name: Require S3 backend and Packer settings
  ansible.builtin.assert:
    that:
      - cluster.tf_backend is defined
      - cluster.tf_backend.bucket | default('') | length > 0
      - cluster.tf_backend.access_key | default('') | length > 0
      - cluster.tf_backend.secret_key | default('') | length > 0
      - cluster.proxmox.api_token | default('') | length > 0
      - cluster.packer is defined
      - cluster.packer.template_id is defined
      - cluster.packer.node | default('') | length > 0
      - cluster.packer.storage_pool | default('') | length > 0
    fail_msg: >-
      cluster.tf_backend.{bucket,access_key,secret_key}, cluster.proxmox.api_token and
      cluster.packer.{template_id,node,storage_pool} must be set.

- name: Write the S3 backend CA from tf_backend.ca_cert
  ansible.builtin.copy:
    content: "{{ cluster.tf_backend.ca_cert }}"
    dest: "{{ tf_backend_ca_file }}"
    mode: "0644"
  check_mode: false
  when: cluster.tf_backend.ca_cert | default('') | length > 0

- name: Check Packer and QEMU are installed
  ansible.builtin.command: "{{ item }}"
  loop:
    - packer version
    - qemu-system-x86_64 --version
    - qemu-img --version
  changed_when: false

- name: Check for an existing image to reuse
  ansible.builtin.stat:
    path: "{{ packer_image }}"
  register: packer_existing_image
  when: packer_skip_build | bool

- name: Require an existing image when skipping the Packer build
  ansible.builtin.assert:
    that:
      - packer_existing_image.stat.exists
    fail_msg: "packer_skip_build is set, but {{ packer_image }} does not exist. Run once without it."
  when: packer_skip_build | bool

- name: Find previously staged CA certificates
  ansible.builtin.find:
    paths: "{{ packer_dir }}/certs"
    patterns: "*.crt"
  register: staged_ca_certs

- name: Clear previously staged CA certificates
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ staged_ca_certs.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Stage CA certificates into the Packer context
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ packer_dir }}/certs/{{ item.name }}.crt"
    mode: "0644"
  loop: "{{ cluster.packer.ca_certs | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

# The temp dir, key, var-file and backend.hcl are local scratch, so they are also created under
# --check: that lets `packer validate` and `tofu plan` run for real. Only `packer build` is skipped.
- name: Create a throwaway SSH key for this Packer build
  ansible.builtin.tempfile:
    state: directory
    prefix: packer-debian-cloud-
  register: packer_keydir
  check_mode: false

- name: Generate throwaway ed25519 keypair
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -t
      - ed25519
      - -N
      - ""
      - -f
      - "{{ packer_keydir.path }}/id_ed25519"
      - -C
      - packer-debian-cloud-ephemeral
  changed_when: true
  check_mode: false

- name: Load throwaway public key
  ansible.builtin.slurp:
    src: "{{ packer_keydir.path }}/id_ed25519.pub"
  register: packer_pubkey_b64
  check_mode: false

- name: Build image and import template
  block:
    - name: Initialize Packer plugins
      ansible.builtin.command:
        cmd: packer init .
        chdir: "{{ packer_dir }}"
      changed_when: false
      check_mode: false

    # Only keys set in the inventory are passed; anything omitted keeps the Packer default.
    - name: Write Packer variables file
      ansible.builtin.copy:
        content: "{{ packer_build_vars | to_nice_json }}"
        dest: "{{ packer_keydir.path }}/build.pkrvars.json"
        mode: "0600"
      check_mode: false
      vars:
        packer_build_vars: >-
          {{
            cluster.packer
            | dict2items
            | selectattr('key', 'in', packer_passthrough_vars)
            | items2dict
            | combine(
                {'timezone': cluster.timezone} if cluster.timezone is defined else {},
                {'timezone': cluster.packer.timezone} if cluster.packer.timezone is defined else {},
                {'disk_size': (cluster.packer.disk_size | string) ~ 'G'} if cluster.packer.disk_size is defined else {},
                {'ssh_private_key_file': packer_keydir.path ~ '/id_ed25519'}
              )
          }}

    - name: Validate Packer template and variables
      ansible.builtin.command:
        argv:
          - packer
          - validate
          - "-var-file={{ packer_keydir.path }}/build.pkrvars.json"
          # validate has no -force and rejects an existing output dir; point it at a fresh path
          # so --check never deletes a previous image.
          - "-var=output_directory={{ packer_keydir.path }}/output"
          - .
        chdir: "{{ packer_dir }}"
      environment:
        PKR_VAR_ssh_public_key: "{{ packer_pubkey_b64.content | b64decode | trim }}"
      changed_when: false
      check_mode: false

    - name: Build Debian cloud image with qemu-guest-agent
      ansible.builtin.command:
        argv:
          - packer
          - build
          - -force  # replace a previous build's output/
          - "-var-file={{ packer_keydir.path }}/build.pkrvars.json"
          - .
        chdir: "{{ packer_dir }}"
      environment:
        PKR_VAR_ssh_public_key: "{{ packer_pubkey_b64.content | b64decode | trim }}"
      register: packer_build
      changed_when: true  # every build produces a fresh image
      when: not packer_skip_build | bool

    - name: Display Packer output
      ansible.builtin.debug:
        var: packer_build.stdout
      when: not ansible_check_mode and not packer_skip_build | bool

    - name: Write OpenTofu S3 backend config for the template
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/backend.hcl.j2"
        dest: "{{ terraform_template_dir }}/backend.hcl"
        mode: "0600"
      check_mode: false
      vars:
        tf_backend: >-
          {{ cluster.tf_backend | combine({
               'key': cluster.packer.tf_state_key | default('proxmox-iac/debian-cloud-template.tfstate'),
               'custom_ca_bundle': tf_backend_ca_file
             }) }}
      no_log: true

    - name: Import qcow2 and convert to a Proxmox template
      community.general.terraform:
        project_path: "{{ terraform_template_dir }}"
        binary_path: "{{ tofu_binary_path }}"
        state: present
        force_init: true
        init_reconfigure: true
        complex_vars: true
        backend_config_files:
          - "{{ terraform_template_dir }}/backend.hcl"
        variables:
          proxmox: "{{ cluster.proxmox }}"
          node_name: "{{ cluster.packer.node }}"
          template_id: "{{ cluster.packer.template_id }}"
          template_name: "{{ cluster.packer.template_name | default('debian-13-genericcloud-agent') }}"
          storage_pool: "{{ cluster.packer.storage_pool }}"
          iso_storage: "{{ cluster.packer.iso_storage | default('local') }}"
          image_path: "{{ packer_image | realpath }}"
          disk_size: "{{ cluster.packer.disk_size | default(10) }}"
      environment: "{{ tf_backend_env }}"
      vars:
        tf_backend_env: >-
          {{
            {
              'AWS_ACCESS_KEY_ID': cluster.tf_backend.access_key,
              'AWS_SECRET_ACCESS_KEY': cluster.tf_backend.secret_key
            }
            | combine(
                {'AWS_CA_BUNDLE': tf_backend_ca_file}
                if (tf_backend_ca_file | length > 0)
                else {}
              )
          }}
      register: template_tf

    - name: Display template import output
      ansible.builtin.debug:
        var: template_tf.stdout
  always:
    - name: Remove throwaway SSH key
      ansible.builtin.file:
        path: "{{ packer_keydir.path }}"
        state: absent
      when: packer_keydir.path is defined
      check_mode: false
